        // IntersectionObserver-based Scroll Reveal Component
        function Reveal({ children, className = "" }) {
            const [isIntersecting, setIsIntersecting] = useState(false);
            const ref = React.useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsIntersecting(true);
                            observer.unobserve(entry.target);
                        }
                    },
                    { threshold: 0.05 }
                );
                if (ref.current) {
                    observer.observe(ref.current);
                }
                return () => {
                    if (ref.current) observer.unobserve(ref.current);
                };
            }, []);

            return (
                <div
                    ref={ref}
                    className={`${className} transition-all duration-1000 ease-out transform ${isIntersecting
                            ? 'translate-y-0 opacity-100'
                            : 'translate-y-10 opacity-0'
                        }`}
                >
                    {children}
                </div>
            );
        }

                                    <p className="text-xs text-espresso/60">We look forward to welcoming you at MSR Cafe Udhampur.</p>
                                </div>
                                <div className="bg-espresso/5 rounded-2xl p-5 border border-espresso/5 text-left space-y-3 text-xs">
                                    <div className="flex justify-between pb-2 border-b border-espresso/10">
                                        <span className="text-espresso/50 font-bold uppercase tracking-wider text-[10px]">Reservation ID</span>
                                        <span className="font-black text-amberGold">{reservationModalDetails.id}</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-espresso/50">Guest Name</span>
                                        <span className="font-bold">{reservationModalDetails.customer_name}</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-espresso/50">WhatsApp</span>
                                        <span className="font-bold">{reservationModalDetails.customer_phone}</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-espresso/50">Date & Slot</span>
                                        <span className="font-bold capitalize">{reservationModalDetails.reservation_date} • {reservationModalDetails.time_slot}</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-espresso/50">Guests & Seating</span>
                                        <span className="font-bold">{reservationModalDetails.guests_count} ({reservationModalDetails.seating_preference})</span>
                                    </div>
                                    {reservationModalDetails.special_notes && (
                                        <div className="pt-2 border-t border-espresso/5">
                                            <span className="text-espresso/50 block mb-1">Special Notes</span>
                                            <p className="italic text-espresso/70 bg-espresso/5 p-2 rounded-lg">{reservationModalDetails.special_notes}</p>
                                        </div>
                                    )}
                                    <div className="pt-2 border-t border-espresso/10">
                                        <p className="text-[10px] text-espresso/50 font-bold uppercase tracking-wider mb-1">Cafe Address</p>
                                        <p className="text-xs font-semibold text-espresso/80">📍 MSR Cafe, Gole Market, Udhampur - 182101, J&K.</p>
                                    </div>
                                </div>
                                <button
                                    onClick={() => setShowReservationModal(false)}
                                    className="w-full bg-espresso hover:bg-amberGold text-cream py-3 rounded-xl font-bold transition-all shadow-md active:scale-95"
                                >
                                    Close & Continue
                                </button>
                            </div>
                        </div>
                    )}

                    {/* CAFE ADMIN VIEW ROUTER */}
                    {isAdminView && (
                        <div className="fixed inset-0 z-50 overflow-y-auto bg-espresso/5 font-sans animate-fade-in flex flex-col justify-between">
                            {!isAdminAuthenticated ? (
                                <div className="flex-1 flex items-center justify-center p-4">
                                    <div className="bg-cream border border-espresso/10 rounded-3xl p-8 max-w-md w-full shadow-2xl space-y-6 text-center animate-slide-up">
                                        <div className="w-16 h-16 bg-espresso/5 rounded-full flex items-center justify-center mx-auto text-2xl text-amberGold">
                                            🔒
                                        </div>
                                        <div className="space-y-1">
                                            <h3 className="font-serif text-2xl font-black text-espresso">Admin Portal</h3>
                                            <p className="text-xs text-espresso/60">Enter the administration access passcode.</p>
                                        </div>
                                        <form onSubmit={(e) => {
                                            e.preventDefault();
                                            if (adminPin === '1234') {
                                                setIsAdminAuthenticated(true);
                                            } else {
                                                alert("Invalid passcode. Access denied.");
                                                setAdminPin('');
                                            }
                                        }} className="space-y-4">
                                            <input
                                                type="password"
                                                value={adminPin}
                                                onChange={(e) => setAdminPin(e.target.value)}
                                                placeholder="Enter passcode"
                                                className="w-full text-center tracking-widest bg-espresso/5 border border-espresso/10 rounded-xl px-4 py-3 text-espresso focus:outline-none focus:border-amberGold text-lg font-black"
                                            />
                                            <button
                                                type="submit"
                                                className="w-full bg-espresso hover:bg-amberGold text-cream py-3.5 rounded-xl font-bold transition-all shadow-md active:scale-95 text-sm"
                                            >
                                                Access Dashboard
                                            </button>
                                        </form>
                                        <button
                                            onClick={() => { window.location.hash = ''; }}
                                            className="text-xs text-espresso/50 hover:text-espresso font-bold hover:underline"
                                        >
                                            Back to Storefront
                                        </button>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex-1 flex flex-col justify-between min-h-screen bg-[#FDFBF7]">
                                    <div className="flex-1 flex flex-col">
                                        {/* Admin Header */}
                                        <header className="bg-espresso text-cream px-6 py-4 flex flex-col sm:flex-row justify-between items-center border-b border-cream/10 gap-4">
                                            <div className="flex items-center space-x-3">
                                                <Icons.Coffee className="w-6 h-6 text-amberGold" />
                                                <div className="text-left">
                                                    <h1 className="font-serif text-xl font-bold">MSR Cafe Admin</h1>
                                                    <p className="text-[10px] text-cream/50 uppercase tracking-widest font-bold">Backoffice Console</p>
                                                </div>
                                            </div>
                                            <div className="flex items-center space-x-4">
                                                <span className={`text-[10px] font-bold uppercase px-3 py-1 rounded-full ${isPlaceholder ? 'bg-amber-100 text-amber-800 border border-amber-200' : 'bg-green-100 text-green-800 border border-green-200'}`}>
                                                    ● {isPlaceholder ? 'Local Storage DB' : 'Live Supabase'}
                                                </span>
                                                <button
                                                    onClick={fetchAdminData}
                                                    disabled={isLoadingAdminData}
                                                    className="bg-cream/10 hover:bg-cream/20 text-cream p-2.5 rounded-xl transition-all disabled:opacity-50 min-w-[44px] min-h-[44px] flex items-center justify-center font-bold"
                                                    title="Refresh Data"
                                                >
                                                    🔄
                                                </button>
                                                <button
                                                    onClick={() => {
                                                        setIsAdminAuthenticated(false);
                                                        window.location.hash = '';
                                                    }}
                                                    className="bg-amberGold hover:bg-amberGold/90 text-cream px-4 py-2.5 rounded-xl text-xs font-bold transition-all min-h-[44px]"
                                                >
                                                    Exit Admin
                                                </button>
                                            </div>
                                        </header>

                                        {/* Dashboard Body */}
                                        <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">
                                            {/* Stats Counters */}
                                            <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                                                <div className="bg-[#FAF7F0] p-4 rounded-2xl border border-espresso/5 shadow-sm text-left">
                                                    <p className="text-[10px] font-bold uppercase text-espresso/40 tracking-wider">Total Orders</p>
                                                    <p className="text-2xl font-black text-espresso mt-1">{adminOrders.length}</p>
                                                </div>
                                                <div className="bg-[#FAF7F0] p-4 rounded-2xl border border-espresso/5 shadow-sm text-left">
                                                    <p className="text-[10px] font-bold uppercase text-espresso/40 tracking-wider">Active Orders</p>
                                                    <p className="text-2xl font-black text-amberGold mt-1">
                                                        {adminOrders.filter(o => o.status === 'Pending' || o.status === 'Preparing').length}
                                                    </p>
                                                </div>
                                                <div className="bg-[#FAF7F0] p-4 rounded-2xl border border-espresso/5 shadow-sm text-left">
                                                    <p className="text-[10px] font-bold uppercase text-espresso/40 tracking-wider">Total Sales</p>
                                                    <p className="text-2xl font-black text-espresso mt-1">
                                                        ₹{adminOrders.filter(o => o.status !== 'Cancelled').reduce((sum, o) => sum + o.total_amount, 0)}
                                                    </p>
                                                </div>
                                                <div className="bg-[#FAF7F0] p-4 rounded-2xl border border-espresso/5 shadow-sm text-left">
                                                    <p className="text-[10px] font-bold uppercase text-espresso/40 tracking-wider">Table Bookings</p>
                                                    <p className="text-2xl font-black text-espresso mt-1">{adminReservations.length}</p>
                                                </div>
                                                <div className="bg-[#FAF7F0] p-4 rounded-2xl border border-espresso/5 shadow-sm text-left col-span-2 md:col-span-1">
                                                    <p className="text-[10px] font-bold uppercase text-espresso/40 tracking-wider">Average Rating</p>
                                                    <p className="text-2xl font-black text-espresso mt-1">
                                                        {reviews.length > 0 ? (reviews.reduce((sum, r) => sum + r.rating, 0) / reviews.length).toFixed(1) : '4.8'} ★
                                                    </p>
                                                </div>
                                            </div>

                                            {/* Tabs Toggle */}
                                            <div className="flex border-b border-espresso/10 gap-6">
                                                <button
                                                    onClick={() => setAdminActiveTab('orders')}
                                                    className={`pb-3 text-sm font-bold border-b-2 transition-all min-h-[44px] ${adminActiveTab === 'orders' ? 'border-amberGold text-espresso' : 'border-transparent text-espresso/50 hover:text-espresso'}`}
                                                >
                                                    Orders Tracker ({adminOrders.length})
                                                </button>
                                                <button
                                                    onClick={() => setAdminActiveTab('reservations')}
                                                    className={`pb-3 text-sm font-bold border-b-2 transition-all min-h-[44px] ${adminActiveTab === 'reservations' ? 'border-amberGold text-espresso' : 'border-transparent text-espresso/50 hover:text-espresso'}`}
                                                >
                                                    Table Reservations ({adminReservations.length})
                                                </button>
                                                <button
                                                    onClick={() => setAdminActiveTab('reviews')}
                                                    className={`pb-3 text-sm font-bold border-b-2 transition-all min-h-[44px] ${adminActiveTab === 'reviews' ? 'border-amberGold text-espresso' : 'border-transparent text-espresso/50 hover:text-espresso'}`}
                                                >
                                                    Customer Reviews ({reviews.length})
                                                </button>
                                            </div>

                                            {/* Listings Grid */}
                                            {isLoadingAdminData ? (
                                                <div className="py-20 text-center space-y-4">
                                                    <div className="animate-spin w-10 h-10 border-4 border-amberGold border-t-transparent rounded-full mx-auto"></div>
                                                    <p className="text-sm text-espresso/60 font-semibold">Syncing with database...</p>
                                                </div>
                                            ) : adminActiveTab === 'orders' ? (
                                                /* Orders Tracker Tab */
                                                adminOrders.length === 0 ? (
                                                    <div className="bg-[#FAF7F0] p-12 rounded-3xl border border-espresso/5 text-center text-espresso/50 text-sm font-bold">
                                                        No storefront orders received yet.
                                                    </div>
                                                ) : (
                                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                                        {adminOrders.map((order) => (
                                                            <div key={order.id} className="bg-[#FAF7F0] rounded-3xl p-5 border border-espresso/5 shadow-sm flex flex-col justify-between space-y-4">
                                                                <div className="space-y-3">
                                                                    {/* Order Ref & Status */}
                                                                    <div className="flex justify-between items-start">
                                                                        <div className="text-left">
                                                                            <span className="font-mono text-amberGold font-extrabold text-sm">{order.id}</span>
                                                                            <p className="text-[10px] text-espresso/40 font-medium">{new Date(order.created_at).toLocaleString()}</p>
                                                                        </div>
                                                                        <span className={`text-[10px] font-black uppercase tracking-wider px-2.5 py-1 rounded-full ${order.status === 'Pending' ? 'bg-amber-100 text-amber-800' :
                                                                                order.status === 'Preparing' ? 'bg-blue-100 text-blue-800' :
                                                                                    order.status === 'Completed' ? 'bg-green-100 text-green-800' :
                                                                                        'bg-red-100 text-red-800'
                                                                            }`}>
                                                                            {order.status}
                                                                        </span>
                                                                    </div>

                                                                    {/* Customer Info */}
                                                                    <div className="grid grid-cols-2 gap-2 text-xs text-espresso/70 border-t border-b border-espresso/5 py-2 text-left">
                                                                        <div>
                                                                            <p className="font-extrabold text-espresso">{order.customer_name}</p>
                                                                            <p className="text-[10px] text-espresso/55 font-bold">{order.customer_phone}</p>
                                                                        </div>
                                                                        <div>
                                                                            <p className="font-extrabold text-espresso capitalize">{order.order_type}</p>
                                                                            <p className="text-[10px] text-espresso/55 italic leading-snug">{order.address_or_table}</p>
                                                                        </div>
                                                                    </div>

                                                                    {/* Items Ordered List */}
                                                                    <div className="space-y-2 text-left">
                                                                        <p className="text-[10px] uppercase tracking-wider text-espresso/45 font-black">Ordered Items</p>
                                                                        <div className="space-y-1.5 max-h-40 overflow-y-auto pr-1">
                                                                            {Array.isArray(order.order_items) && order.order_items.map((item, idx) => {
                                                                                const opts = [];
                                                                                if (item.selectedOption) opts.push(item.selectedOption);
                                                                                if (item.selectedMilk && item.selectedMilk !== 'Standard') opts.push(`${item.selectedMilk} Milk`);
                                                                                const customizations = opts.length > 0 ? ` (${opts.join(', ')})` : '';
                                                                                return (
                                                                                    <div key={idx} className="flex justify-between text-xs font-sans text-espresso/80">
                                                                                        <span>{item.quantity} x {item.name}{customizations}</span>
                                                                                        <span className="font-bold">₹{item.price * item.quantity}</span>
                                                                                    </div>
                                                                                );
                                                                            })}
                                                                        </div>
                                                                    </div>
                                                                </div>

                                                                {/* Pricing & Control Panel */}
                                                                <div className="pt-4 border-t border-espresso/5 space-y-3">
                                                                    <div className="flex justify-between items-center text-sm">
                                                                        <span className="font-medium text-espresso/50">Total Bill</span>
                                                                        <span className="font-black text-espresso text-base">₹{order.total_amount}</span>
                                                                    </div>
                                                                    <div className="flex flex-wrap gap-1.5 pt-1">
                                                                        {['Pending', 'Preparing', 'Completed', 'Cancelled'].map((st) => (
                                                                            <button
                                                                                key={st}
                                                                                onClick={() => handleUpdateOrderStatus(order.id, st)}
                                                                                className={`text-[10px] font-extrabold uppercase px-2.5 py-1.5 rounded-lg border transition-all min-h-[44px] ${order.status === st
                                                                                        ? 'bg-espresso text-cream border-espresso'
                                                                                        : 'bg-transparent text-espresso/60 border-espresso/15 hover:bg-espresso/5'
                                                                                    }`}
                                                                            >
                                                                                {st}
                                                                            </button>
                                                                        ))}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )
                                            ) : adminActiveTab === 'reservations' ? (
                                                /* Reservations List Tab */
                                                adminReservations.length === 0 ? (
                                                    <div className="bg-[#FAF7F0] p-12 rounded-3xl border border-espresso/5 text-center text-espresso/50 text-sm font-bold">
                                                        No table bookings received yet.
                                                    </div>
                                                ) : (
                                                    <div className="overflow-x-auto bg-[#FAF7F0] border border-espresso/5 rounded-3xl shadow-sm">
                                                        <table className="w-full text-left border-collapse text-sm">
                                                            <thead>
                                                                <tr className="bg-espresso/5 text-[10px] font-black uppercase tracking-wider text-espresso/50 border-b border-espresso/10">
                                                                    <th className="p-4">Reference</th>
                                                                    <th className="p-4">Customer</th>
                                                                    <th className="p-4">Date & Slot</th>
                                                                    <th className="p-4">Covers & Prefs</th>
                                                                    <th className="p-4">Notes</th>
                                                                    <th className="p-4">Submitted</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody>
                                                                {adminReservations.map((res) => (
                                                                    <tr key={res.id} className="border-b border-espresso/5 hover:bg-espresso/5 transition-colors font-sans text-xs text-espresso/80">
                                                                        <td className="p-4 font-mono font-bold text-amberGold">{res.id}</td>
                                                                        <td className="p-4 text-left">
                                                                            <p className="font-extrabold text-espresso">{res.customer_name}</p>
                                                                            <p className="text-[10px] text-espresso/55 font-bold">{res.customer_phone}</p>
                                                                        </td>
                                                                        <td className="p-4 text-left">
                                                                            <p className="font-bold text-espresso">{res.reservation_date}</p>
                                                                            <p className="text-[10px] text-espresso/55 uppercase tracking-wide font-extrabold">{res.time_slot}</p>
                                                                        </td>
                                                                        <td className="p-4 text-left">
                                                                            <p className="font-extrabold text-espresso">{res.guests_count}</p>
                                                                            <p className="text-[10px] text-espresso/55 font-semibold">{res.seating_preference}</p>
                                                                        </td>
                                                                        <td className="p-4 max-w-[200px] truncate text-left" title={res.special_notes}>
                                                                            {res.special_notes || <span className="text-espresso/30 italic">None</span>}
                                                                        </td>
                                                                        <td className="p-4 text-[10px] text-espresso/45 text-left">{new Date(res.created_at).toLocaleString()}</td>
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                )
                                            ) : (
                                                /* Customer Reviews Tab */
                                                reviews.length === 0 ? (
                                                    <div className="bg-[#FAF7F0] p-12 rounded-3xl border border-espresso/5 text-center text-espresso/50 text-sm font-bold">
                                                        No customer reviews received yet.
                                                    </div>
                                                ) : (
                                                    <div className="overflow-x-auto bg-[#FAF7F0] border border-espresso/5 rounded-3xl shadow-sm">
                                                        <table className="w-full text-left border-collapse text-sm">
                                                            <thead>
                                                                <tr className="bg-espresso/5 text-[10px] font-black uppercase tracking-wider text-espresso/50 border-b border-espresso/10">
                                                                    <th className="p-4">ID</th>
                                                                    <th className="p-4">Customer</th>
                                                                    <th className="p-4">Rating</th>
                                                                    <th className="p-4">Comment</th>
                                                                    <th className="p-4">Submitted</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody>
                                                                {reviews.map((rev) => (
                                                                    <tr key={rev.id} className="border-b border-espresso/5 hover:bg-espresso/5 transition-colors font-sans text-xs text-espresso/80">
                                                                        <td className="p-4 font-mono font-bold text-amberGold max-w-[120px] truncate" title={rev.id}>{rev.id}</td>
                                                                        <td className="p-4 text-left font-extrabold text-espresso">{rev.customer_name}</td>
                                                                        <td className="p-4 text-left font-black text-amberGold">
                                                                            {rev.rating} ★ ({'★'.repeat(rev.rating)}{'☆'.repeat(5 - rev.rating)})
                                                                        </td>
                                                                        <td className="p-4 max-w-[300px] truncate text-left" title={rev.comment}>{rev.comment}</td>
                                                                        <td className="p-4 text-[10px] text-espresso/45 text-left">{new Date(rev.created_at).toLocaleString()}</td>
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                )
                                            )}
                                        </main>
                                    </div>
                                    <footer className="bg-espresso text-cream/40 text-[10px] text-center py-4 border-t border-cream/10">
                                        &copy; 2026 MSR Cafe Admin Backoffice. Unauthorized access is prohibited.
                                    </footer>
                                </div>
                            )}
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
